name: Build Push and Deploy Image 

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
env:
  IMAGE_NAME: jebnouniatef/pwa-click2eat
  CONTAINER_NAME: pwa-container

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true

        tags: |
          ${{ secrets.DOCKER_USERNAME }}/pwa-click2eat:latest
          ${{ secrets.DOCKER_USERNAME }}/pwa-click2eat:${{ github.sha }}



    - name: Deploy to Azure VM
      uses: appleboy/ssh-action@v1.0.3
      with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            docker pull docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

            docker stop pwa || true
            docker rm pwa || true

            docker run -d \
              --name pwa \
              -v /opt/.env:/app/.env
              -p 5174:5173 \
              docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
